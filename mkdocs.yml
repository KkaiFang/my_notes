plugins:

  - search:
      separator: '[\s\u200b\-\u3000\u3001\u3002\uFF0C\uFF0E\uFF1F\uFF01\uFF1B]+'
  # \u81EA\u52A8\u751F\u6210\u5BFC\u822A\uFF1A\u626B\u63CF\u76EE\u5F55\u4E0B\u6240\u6709 md\uFF0C\u6309 .pages \u89C4\u5219\u6392\u5E8F/\u5206\u7C7B\uFF0C\u672A\u5217\u51FA\u7684\u81EA\u52A8\u8FFD\u52A0
  - awesome-pages
  # - git-revision-date-localized:
  #     enabled: !ENV [CI, false]  # 改为 false 禁用本地渲染
  #     type: iso_date
  #     enable_creation_date: true
  #     fallback_to_build_date: true
  #     exclude:
  #       - index.md 
  #       - tag.md
  #       - waline.md
  #       - link.md
  #       - blog/Mkdocs/linktech.md
  #       - "blog/archive/**"
  #       - "blog/category/**"
  # - git-committers:
  #     enabled: !ENV [CI, false]  # 改为 false 禁用本地渲染
  #     repository: Wcowin/Wcowin.github.io
  #     branch: main
  #     exclude:
  #       - index.md 
  #       - tag.md
  #       - waline.md
  #       - link.md
  #       - blog/Mkdocs/linktech.md
  - blog:
      post_date_format: full #时间
      draft: true
      draft_if_future_date: true #自动将具有未来日期的帖子标记为草稿
      # post_readtime: true
      post_readtime_words_per_minute: 265  #计算帖子的阅读时间时读者每分钟预计阅读的字数
      post_url_format: "{date}/{slug}"
      # categories_slugify: !!python/object/apply:pymdownx.slugs.slugify
      #   kwds:
      #     case: lower
      # categories_toc: true
      pagination_per_page: 5
      pagination_url_format: "page/{page}"
      # authors_file: "{blog}/.authors.yml"  #作者信息
  - tags
  - document-dates:
      position: bottom            # Display position: top (after title)  bottom (end of document), default: bottom
      type: date               # Date type: date  datetime  timeago, default: date
      locale: zh               # Localization: en zh zh_TW es fr de ar ja ko ru, default: en
      date_format: '%Y-%m-%d'  # Date format strings, e.g., %Y-%m-%d, %b %d, %Y, etc
      time_format: '%H:%M:%S'  # Time format strings (valid only if type=datetime)
      exclude:                 # List of excluded files
        # - index.md
        - blog/posts/*
        # - blog/index.md
        # - about.md         # Exclude all files in private directory, including subdirectories
      show_author: true       # Show author or not, default:java true
 

markdown_extensions:
  - meta  # 解析 md 顶部的 YAML front matter（title/date/tags 等），原来是隐式默认，显式声明避免被意外丢弃
  - abbr
  - attr_list
  - admonition
  - def_list
  - footnotes
  # - callouts
  - md_in_html
  - pymdownx.magiclink
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.betterem
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.tilde

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
      preserve_tabs: true
  - pymdownx.arithmatex:  
      generic: true
  - toc:
      permalink: true # 固定标题位置为当前位置
      # baselevel: 2
      # toc_depth: 3  # 控制标题层级深度
  - pymdownx.highlight: # 代码块高亮
      anchor_linenums: true
      linenums: true # 显示行号
      auto_title: true # 显示编程语言名称
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  # - neoteroi.timeline

  
extra_javascript:
  # 全部改用仓库内本地文件：不再依赖 Wcowin/Wcowin.github.io 这个上游仓库，
  # 减少跨域请求和首屏阻塞（原来 view.js 在 CDN 上已 404，每次访问都白等一次）
  - javascripts/unified-instant-handler.js  # 供 footer.html 的 InstantNavigation.register 使用
  - javascripts/extra.js                    # 错误处理、兼容性修复、性能优化
  # MathJax 配置必须排在主库之前加载
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  # - javascripts/liquid-glass-toc.js  # Liquid Glass TOC 增强效果
  # - javascripts/glm-config.js
  # - javascripts/glm-translate.js




extra_css:
  # 全部改用仓库内本地文件。原来 extra.css 既加载本地又加载 CDN 同名文件，
  # 两份内容不同（CDN 多 8 条规则、少 4 条），等于样式互相覆盖，排查问题非常麻烦。
  - stylesheets/extra.css
  - stylesheets/extra2.css
  - stylesheets/link.css      # 友链
  - stylesheets/customize.css # 按钮圆角化
  - stylesheets/ziti.css      # 字体
  - stylesheets/poem.css
  # - stylesheets/highlight-search.css
  # - stylesheets/optimize.css
  # - stylesheets/card2.css
  # - stylesheets/flink.css
  # - stylesheets/bannerSlider.css


watch: #监听文件变动自动刷新
  - docs
  - mkdocs.yml
  - docs/overrides

hooks:
  - docs/overrides/hooks/auto_nav_title.py  # 给自动导航的页面补标题（取正文 H1）
  - docs/overrides/hooks/reading_time.py    # 正文顶部插入阅读时长提示
  - docs/overrides/hooks/related_posts.py   # 底部相关文章推荐
  - docs/overrides/hooks/comments.py        # 自动注入 Twikoo 评论
  # 其余 hook 未启用：
  #   socialmedia.py / toc_optimizer.py / last_updated.py / reading_progress.py