{% if page.meta.comments %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
  <!-- 评论系统加载提示 -->
  <div id="comment-loading" style="text-align: center; padding: 2rem; color: #666;">
    <p>评论系统加载中...</p>
  </div>

  {#-
    Giscus 的 client.js 执行时用 document.currentScript 读配置，并立即在脚本后面插入
    iframe；它不会「记住」配置，页面切走后也不会自己重新渲染。

    站点开启了 navigation.instant（无刷新切页），切页后内联 <script> 不会重新执行，
    所以这里只输出配置占位（不带 src），由 javascripts/comments.js 在首次加载和每次
    切页后为当前页面插入一次 client.js——既不会重复渲染，也不会切页后消失。
  -#}
  <script
        type="application/json"
        data-giscus-placeholder
        data-repo="KkaiFang/my_notes"
        data-repo-id="R_kgDOPpzuUQ"
        data-category="General"
        data-category-id="DIC_kwDOPpzuUc4CvmJw"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        crossorigin="anonymous">
  </script>
{% endif %}
